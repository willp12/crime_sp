name: Keep Streamlit alive

on:
  schedule:
    # O Community Cloud hiberna o app apos 12h sem trafego, e o GitHub atrasa
    # (1-6h) ou descarta execucoes agendadas no topo da hora. A cada 2h, no
    # minuto 37, o intervalo real fica bem abaixo de 12h mesmo com perdas.
    - cron: "37 */2 * * *"
  workflow_dispatch:         # permite teste manual

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: keepalive
      cancel-in-progress: false
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright==1.63.0
          playwright install --with-deps chromium

      - name: Visit Streamlit app
        run: python scripts/keepalive.py

      - name: Upload evidencias
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keepalive-evidencias
          path: keepalive-artifacts/
          retention-days: 7

  # Em repo publico, o GitHub desativa workflows agendados apos 60 dias sem
  # atividade no repo (foi o que parou este keepalive em out/2026). Reabilitar
  # pela API antes do prazo zera o contador sem commits artificiais: e a mesma
  # chamada da action liskin/gh-workflow-keepalive. Job separado para rodar
  # mesmo quando o ping falha.
  manter-agendamentos:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Reabilitar workflows agendados
        run: |
          for wf in keepalive.yml pipeline.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
            echo "Reabilitado: $wf"
          done
